name: Generate Snake

on:
  # Tự động chạy mỗi 24 giờ (vào lúc 00:00 UTC)
  schedule:
    - cron: "0 0 * * *"

  # Cho phép chạy thủ công
  workflow_dispatch:

  # Chạy mỗi khi push vào branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Tạo Snake từ GitHub contribution graph
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push file đã tạo lên branch output
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
